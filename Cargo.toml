[workspace]
members = ["apps/cli", "apps/remote", "crates/kelp-core"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
ignore = "0.4"
kelp-core = { path = "crates/kelp-core" }
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"
